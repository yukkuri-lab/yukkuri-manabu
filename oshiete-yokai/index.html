<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おしえてようかい">
<title>おしえて ようかい</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --paper:#FBF7E9;--pencil:#4D4A45;--soft:#686159;--rule:#BFD8EC;--margin:#E7B0A6;
  --blue:#6F92BC;--pick-bg:#E8EEF5;--pick-border:#6F8195;--panel-border:#D9CFBD;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--pencil)}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
main{min-height:100dvh;max-width:760px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom)) 48px;position:relative;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--rule) 39px,var(--rule) 40px)}
main:before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:var(--margin)}
#app{position:relative}
h1{font-size:clamp(27px,7vw,42px);font-weight:900;margin:0;letter-spacing:.04em;text-align:center}
h1:focus,.q:focus{outline:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pill{font-size:14px;border:2px solid var(--panel-border);border-radius:999px;padding:8px 12px;white-space:nowrap;background:var(--paper)}
.q{font-size:24px;font-weight:900;margin:20px 0 12px;line-height:1.6}
.hint{font-size:16px;color:var(--pencil);margin:0 0 12px;line-height:1.7}
.center{text-align:center}

/* ボタン */
.card,.btn,.area,.tile,.mon{font:inherit;color:var(--pencil);background:var(--paper);cursor:pointer;touch-action:manipulation;transition:transform .08s,background .15s}
.card:hover,.btn:hover,.area:hover,.tile:hover,.mon:hover{background:var(--pick-bg)}
.card:active,.btn:active,.area:active,.tile:active,.mon:active{transform:translateY(2px) scale(.98)}
.card:focus-visible,.btn:focus-visible,.area:focus-visible,.tile:focus-visible,.mon:focus-visible,.link:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid.one{grid-template-columns:1fr}
@media(min-width:640px){.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{font-size:24px;font-weight:900;border:2px solid var(--soft);border-radius:13px;min-height:88px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.4;box-shadow:0 3px 0 var(--panel-border)}
.card.small{font-size:16px;min-height:64px}
.card .face{font-size:48px;line-height:1}
.btn{font-size:16px;font-weight:900;border:2px solid var(--soft);border-radius:999px;min-height:48px;padding:12px 20px}
.btn.main{background:var(--paper);border-color:var(--pick-border);font-size:24px;min-height:64px;padding:12px 40px;box-shadow:0 4px 0 var(--pick-border)}
.btn.main:hover{background:var(--pick-bg)}
.btn.wide{width:100%}
.link{font:inherit;font-size:16px;font-weight:700;color:var(--pencil);background:none;border:none;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.link:hover{text-decoration-thickness:3px}
.link:active{transform:translateY(1px)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;align-items:center}
.row.mid{justify-content:center}

/* ようかい */
.stage{display:flex;align-items:flex-end;gap:12px;margin:12px 0}
.stage.big{flex-direction:column;align-items:center;margin:20px 0}
.ykw{flex:none;width:120px;height:120px;display:flex;align-items:flex-end;justify-content:center}
.stage.big .ykw{width:min(100%,260px);height:240px}
.yk{max-width:100%;max-height:100%;object-fit:contain;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.yk.shadow{filter:brightness(0) opacity(.85)}
.yk.half{filter:brightness(.45) saturate(.4)}
.yk.eat{animation:chomp .22s ease-in-out 5}
.yk.reveal{animation:reveal .9s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes chomp{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.9)}}
@keyframes reveal{0%{transform:scale(.6) rotate(-8deg);filter:brightness(3)}60%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1)}}
.bubble{position:relative;flex:1;min-width:0;font-size:16px;line-height:1.7;background:var(--paper);border:2px solid var(--pick-border);border-radius:13px;padding:12px;margin-bottom:20px}
.bubble:after{content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:var(--paper);border-left:2px solid var(--pick-border);border-bottom:2px solid var(--pick-border);transform:rotate(45deg)}
.stage.big .bubble{margin:12px 0 0;width:100%;text-align:center;font-size:24px;font-weight:900}
.stage.big .bubble:after{left:50%;top:-10px;bottom:auto;margin-left:-8px;transform:rotate(135deg)}
.say{flex:none;font:inherit;font-size:16px;background:none;border:2px solid var(--panel-border);border-radius:999px;width:40px;height:40px;cursor:pointer;margin-left:8px;vertical-align:middle}
.say:hover{background:var(--pick-bg)}
.say:active{transform:scale(.95)}
.say:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* おだい */
.odai{border:2px solid var(--pick-border);border-radius:13px;padding:12px 20px;background:var(--paper);margin:0 0 12px;animation:flip .45s ease-out}
.odai.still{animation:none}
.odai-label{font-size:13px}
.odai-text{font-size:24px;font-weight:900;line-height:1.6;margin:0}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}

/* ごはんの文 */
.bowl{font-size:24px;font-weight:900;line-height:2.1;margin:12px 0;padding:12px 20px;border:2px solid var(--panel-border);border-radius:13px;background:var(--paper)}
.bowl p{margin:0}
.r-act{border-bottom:4px solid var(--blue)}
.r-feel{border-bottom:4px solid var(--margin)}
.r-why{border-bottom:4px dashed var(--pick-border)}
.r-next{border-bottom:4px dotted var(--blue)}
.slot{display:inline-block;min-width:3em;padding:0 8px;border:2px dashed var(--soft);border-radius:10px;color:var(--soft);font-size:16px;line-height:1.8;text-align:center;vertical-align:middle}
.slot.cur{border-style:solid;border-color:var(--pick-border);background:var(--pick-bg);color:var(--pencil)}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.1)}100%{transform:scale(1)}}

/* ならべる */
.slots{display:grid;gap:8px;margin:12px 0}
.lineslot{min-height:56px;border:2px dashed var(--soft);border-radius:13px;padding:12px;font-size:16px;display:flex;align-items:center;gap:8px}
.lineslot b{flex:none;width:32px;height:32px;border-radius:999px;border:2px solid var(--pick-border);display:flex;align-items:center;justify-content:center}
.lineslot.filled{border-style:solid;border-color:var(--pick-border);background:var(--pick-bg)}
.tiles{display:grid;gap:12px}
.tile{font-size:16px;font-weight:900;border:2px solid var(--soft);border-radius:13px;padding:12px;text-align:left;line-height:1.6;min-height:56px;box-shadow:0 3px 0 var(--panel-border)}
.shake{animation:shake .35s;border-color:var(--margin)!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* かく */
.pad{position:relative;width:min(100%,700px);height:200px;border:2px solid var(--pick-border);border-radius:13px;overflow:hidden;
  background:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 99px,var(--rule) 99px,var(--rule) 100px)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.guide{font-size:24px;font-weight:900;line-height:1.7;margin:12px 0}
.dots{display:flex;gap:8px;justify-content:center;margin:12px 0}
.dot{width:14px;height:14px;border-radius:999px;border:2px solid var(--pick-border)}
.dot.on{background:var(--blue);border-color:var(--blue)}

/* けっか */
.got{font-size:24px;font-weight:900;margin:12px 0;text-align:center}
.meter{display:flex;gap:8px;justify-content:center;margin:12px 0}
.meter span{width:40px;height:40px;border-radius:999px;border:2px solid var(--pick-border);display:flex;align-items:center;justify-content:center;font-size:24px}
.meter span.on{background:var(--pick-bg)}

/* マップ */
.hero{border:2px solid var(--pick-border);background:var(--paper);border-radius:13px;padding:12px 20px;display:flex;align-items:center;gap:12px;margin:20px 0 12px}
.hero .ykw{width:96px;height:96px}
.hero-text{flex:1;min-width:0}
.hero-text .q{margin:0 0 8px}
.areas{display:grid;gap:12px}
.area{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--soft);border-radius:13px;padding:12px;box-shadow:0 3px 0 var(--panel-border)}
.area.lock{border-style:dashed;box-shadow:none;cursor:default}
.area.lock:hover{background:var(--paper)}
.area.lock:active{transform:none}
.area-icon{flex:none;font-size:40px;width:56px;text-align:center}
.area-text{flex:1;min-width:0}
.area-name{display:block;font-size:16px;font-weight:900;line-height:1.5}
.area-desc{display:block;font-size:16px;color:var(--soft);line-height:1.5}
.mini{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.mini img{width:28px;height:28px;object-fit:contain}
.mini img.shadow{filter:brightness(0) opacity(.6)}

/* ずかん */
.zukan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 20px}
@media(min-width:640px){.zukan{grid-template-columns:repeat(5,minmax(0,1fr))}}
.mon{border:2px solid var(--soft);border-radius:13px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.mon img{width:100%;height:80px;object-fit:contain}
.mon img.shadow{filter:brightness(0) opacity(.6)}
.mon .name{font-size:13px;line-height:1.4}
.mon.lock{border-style:dashed;cursor:default}
.mon.lock:hover{background:var(--paper)}
.zukan-h{font-size:16px;margin:20px 0 0}

.mic{font-size:24px;min-height:88px;padding:12px 40px}
.mic.on{background:var(--pick-bg);border-color:var(--pick-border);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.heard{min-height:40px;font-size:24px;font-weight:900;text-align:center;margin:12px 0;line-height:1.6}
.typein{display:flex;gap:8px;margin-top:12px}
.typein input{flex:1;min-width:0;font:inherit;font-size:24px;color:var(--pencil);background:var(--paper);border:2px solid var(--pick-border);border-radius:10px;padding:12px}
.typein input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.alt{margin-top:12px}
[hidden]{display:none!important}
.btn[aria-pressed="true"]{background:var(--pick-bg);border-color:var(--pick-border)}
details{margin-top:40px;font-size:14px;color:var(--pencil);line-height:1.8}
details .link{font-size:16px}
summary{cursor:pointer;padding:8px 0}
summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

@media(max-width:390px){
  main{padding-left:40px;padding-right:12px}main:before{left:24px}
  .card{font-size:16px;min-height:72px}.card .face{font-size:40px}
  .bowl,.odai-text,.guide{font-size:16px}.bowl{padding:12px}
  .ykw{width:88px;height:88px}
  .btn.main{padding:12px 20px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  {s:'そうじ',a:'ぞうきんがけ きょうそうを しました',d:['スタートの とき','とちゅうの ところ','ゴールした とき']},

// きもち（p は「どこが」と つなぐ ことば。p が ない きもちは やまでは でない）
const FEELINGS = [

// Googleの しぜんな こえ（おはなしの森と 同じ サーバー）。つかえない ときは ブラウザの こえに もどる
const TTS_URL='https://ohanashi-no-mori.vercel.app/api/speak';
const VOICE_KEYS=['yokai-a','yokai-b','yokai-c','yokai-d'];
let ttsOK=true, cur=null;
function browserSpeak(text,yokai){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; u.rate=yokai?.95:.85; u.pitch=yokai?1.3:1; if(voice) u.voice=voice;
  speechSynthesis.speak(u);
}
function speak(text,yokai=true){
  playbackMode(); hush();
  const t=String(text).replace(/[ 　]/g,'').slice(0,480);
  if(!t) return;
  const key=S.voice||'yokai-a';
  if(!ttsOK || key==='browser') return browserSpeak(t,yokai);
  try{
    const a=new Audio(`${TTS_URL}?text=${encodeURIComponent(t)}&voice=${yokai?key:'default'}`);
    cur=a;
    a.onerror=()=>{ ttsOK=false; browserSpeak(t,yokai) };   // つながらない・ことわられた ときは ブラウザの こえ
    const pr=a.play();
    if(pr&&pr.catch) pr.catch(()=>{ ttsOK=false; browserSpeak(t,yokai) });
  }catch(e){ ttsOK=false; browserSpeak(t,yokai) }
}
const hush=()=>{ if(window.speechSynthesis) speechSynthesis.cancel(); if(cur){ try{ cur.pause() }catch(e){} cur=null } };

// こうかおん
let ac=null;
function sfx(kind){
  playbackMode();
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume();
    const t=ac.currentTime;
    const tone=(f,st,d,type='sine',v=.18)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t+st); g.gain.setValueAtTime(v,t+st); g.gain.exponentialRampToValueAtTime(.001,t+st+d); o.connect(g).connect(ac.destination); o.start(t+st); o.stop(t+st+d) };
    if(kind==='tap') tone(660,0,.08,'triangle',.12);
    if(kind==='no') { tone(300,0,.12,'square',.08); tone(220,.12,.16,'square',.08) }
    if(kind==='chomp') for(let i=0;i<5;i++) tone(140+Math.random()*60,i*.22,.12,'sawtooth',.12);
    if(kind==='yay') [523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,'triangle',.18));
    if(kind==='step') tone(880,0,.1,'triangle',.12);
  }catch(e){}
}

let P=null, lastOdai=-1;
function startPlay(ai){
  P={ai, mech:AREAS[ai].mech, code:nextYokai(ai), ctx:null, act:null, feel:null, detail:null, why:null, next:null, form:ai};
  const hello = met(P.code) ? `${sensei()}！ ${YOKAI[P.code]}だよ。おなか すいた〜！ きょうの はなし、きかせて！` : `${sensei()}、おなか すいた〜！ きょうの はなし、きかせて！`;

    <div class="row mid"><button class="btn main" id="teach" type="button">🎤 きょうの ことを おしえる</button></div>
    <div class="row mid"><button class="btn" id="draw" type="button">🃏 おだいカードで あそぶ</button></div>`);
  bindSay(hello); speak(hello);
  on('#teach',()=>{ sfx('step'); teachStart() });
  on('#draw',()=>{ sfx('step'); P.ctx=drawOdai(); begin() });
}
function topBar(){ return `<div class="top"><button class="link" id="home" type="button">← もどる</button><span class="pill">${AREAS[P.ai].icon} ${esc(AREAS[P.ai].name)}</span></div>` }
function bindTop(){ on('#home',()=>{ hush(); home() }) }
function drawOdai(){ let i; do{ i=Math.floor(Math.random()*ODAI.length) }while(i===lastOdai); lastOdai=i; const o=ODAI[i]; return {s:o.s,a:o.a,d:o.d,odai:true} }
function odaiHTML(){ const f=P.flipped?' still':''; P.flipped=true; return `<div class="odai${f}"><div class="odai-label">${P.ctx.odai?'🃏 おだいカード':'🏫 きょうの じゅぎょう'}</div><p class="odai-text">${esc(when(P.ctx.s))} ${esc(P.ctx.a)}。</p></div>` }
function pickSubject(){
  const items=Object.keys(SUBJECTS), t='きょうは なんの じかんの はなし？';
  show(`${topBar()}${stageHTML(P.code,t)}<div class="grid four">${items.map((s,i)=>`<button class="card small" type="button" data-i="${i}">${esc(s)}</button>`).join('')}</div>`);
  bindTop(); bindSay(t); speak(t);
  on('.card',e=>{ sfx('tap'); P.ctx={s:items[+e.currentTarget.dataset.i],a:null,d:pick(REAL_DETAILS,3),odai:false}; pickAction() });
}
function pickAction(){
  const items=SUBJECTS[P.ctx.s], t=`${P.ctx.s}で なにを した？`;
  show(`${topBar()}${stageHTML(P.code,t)}<div class="grid">${items.map((a,i)=>`<button class="card small" type="button" data-i="${i}">${esc(a)}</button>`).join('')}</div>`);
  bindTop(); bindSay(t); speak(t);

}
function begin(){
  // じゅぎょうモードと もり・そうげん は「したこと」が きまっている。みずうみ から おだいの ときは じぶんで えらぶ
  P.act = (!P.ctx.odai || P.ai<=1) ? P.ctx.a : null;
  ({erabu:erabu, narabe:narabe, anaume:fill, kondo:fill, dokoga:fill, koe:koe, kaku:kaku})[P.mech]();
}
const hasNext=f=>f>=3, hasDetail=f=>f===4;
const when=s=>s.endsWith('じかん')?`${s}に`:`${s}の じかんに`; // 「やすみじかんの じかんに」に しない
function lines(){
  const L=[{r:'act',t:`きょうは、${when(P.ctx.s)} ${P.act}。`},

    {r:'why',t:`なぜかと いうと、${P.why}からです。`}];
  if(P.next) L.push({r:'next',t:`こんどは、${P.next}。`});
  return L;
}

/* ---- かく：なぞる・うつす・あなだけ かく（S.paper なら かみの ノートに） ---- */
function ladder(L){
  if(P.ai===2) return [{say:'きもちの ことばを なぞってみよう', guide:L[1].t, r:'feel', trace:P.feel.w}];
  if(P.ai===3) return [{say:'1ぎょうめを うつしてみよう', guide:L[0].t, r:'act'}];

function writeSeq(specs,next){
  if(!specs.length) return next(true);
  let n=0;
  const render=()=>{
    const p=specs[n];
    show(`${topBar()}${stageHTML(P.code,p.say)}
      ${specs.length>1?`<div class="dots" aria-label="${n+1}つめ">${specs.map((_,i)=>`<span class="dot ${i<=n?'on':''}"></span>`).join('')}</div>`:''}
      <p class="guide"><span class="r-${p.r}">${esc(p.guide)}</span></p>${p.hint?`<p class="hint">${esc(p.hint)}</p>`:''}
      ${S.paper?'<p class="hint">ノートに かいたら おしてね</p>'
        :'<div class="pad"><canvas id="cv" aria-label="ゆびで かく ところ"></canvas></div><div class="row"><button class="btn" id="erase" type="button">🧽 けす</button></div>'}
      <div class="row mid"><button class="btn main" id="ok" type="button">${S.paper?'📓 かけた！':'✏️ かけた！'}</button></div>
      <div class="row mid"><button class="link" id="skip" type="button">きょうは かかない</button></div>`);
    bindTop(); bindSay(p.say); speak(p.say);
    if(!S.paper){ const cv=app.querySelector('#cv'); pad(cv,p.trace); on('#erase',()=>pad(cv,p.trace)) }
    on('#ok',()=>{ sfx('step'); n++; if(n<specs.length) render(); else next(true) });
    on('#skip',()=>{ sfx('tap'); next(false) });
  };
  render();
}
function pad(cv,trace){
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const g=cv.getContext('2d'); g.scale(dpr,dpr);
  if(trace){ const t=trace.replace(/ /g,''), size=Math.min(120,(r.width-24)/t.length); g.font=`900 ${size}px "Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif`; g.fillStyle='#D9CFBD'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(t,r.width/2,r.height/2) }
  g.lineWidth=4; g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#4D4A45';
  let d=false; const pt=e=>{ const b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top] };
  cv.onpointerdown=e=>{ d=true; cv.setPointerCapture(e.pointerId); const [x,y]=pt(e); g.beginPath(); g.moveTo(x,y); g.lineTo(x+.1,y+.1); g.stroke() };
  cv.onpointermove=e=>{ if(!d) return; const [x,y]=pt(e); g.lineTo(x,y); g.stroke() };
  cv.onpointerup=cv.onpointercancel=()=>{ d=false };
}

// こえの ききとり（Safari・Chrome など）。つかえない ブラウザでは もじの わく（キーボードの🎤で はなせる）
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen(onPart,onEnd){
  let fin=false, text='', r=null;
  const end=err=>{ if(fin) return; fin=true; clearTimeout(tm); try{ if(navigator.audioSession) navigator.audioSession.type='playback' }catch(e){}; onEnd(text,err) };
  try{ if(navigator.audioSession) navigator.audioSession.type='play-and-record' }catch(e){}
  try{ r=new SR() }catch(e){ end('unavailable'); return null }
  r.lang='ja-JP'; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
  r.onresult=e=>{ text=[...e.results].map(x=>x[0].transcript).join(''); onPart(text) };
  r.onerror=e=>end(e.error); r.onend=()=>end();
  const tm=setTimeout(()=>{ try{ r.stop() }catch(e){} },9000);
  try{ r.start() }catch(e){ end('unavailable') }
  return r;
}
// はなした ことばを かたに いれる
const clean=t=>String(t).replace(/[。、．，！？!?.,\s　]+$/,'').replace(/^[\s　]+/,'');
const ACT_END=[['やった','やりました'],['いった','いきました'],['行った','行きました'],['みた','みました'],['見た','見ました'],['たべた','たべました'],['食べた','食べました'],['よんだ','よみました'],['読んだ','読みました'],['かいた','かきました'],['書いた','書きました'],['つくった','つくりました'],['作った','作りました'],['あそんだ','あそびました'],['遊んだ','遊びました'],['うたった','うたいました'],['歌った','歌いました'],['はしった','はしりました'],['走った','走りました'],['とんだ','とびました'],['跳んだ','跳びました'],['きいた','ききました'],['聞いた','聞きました'],['した','しました']];
function actPolite(t){ t=clean(t); if(/(ました|でした)$/.test(t)) return t; for(const [a,b] of ACT_END) if(t.endsWith(a)) return t.slice(0,-a.length)+b; if(/(でき|き)た$/.test(t)||/[えけげせぜてでねべめれ]た$/.test(t)) return t.slice(0,-1)+'ました'; if(/[たっだ]$/.test(t)) return t; if(t.endsWith('を')) return t+' しました'; return t+'を しました' }
const FEEL_KANJI={'たのしい':'たのしかった','うれしい':'うれしかった','むずかしい':'むずかしかった','おもしろい':'おもしろかった','くやしい':'くやしかった','楽しかった':'たのしかった','難しかった':'むずかしかった','嬉しかった':'うれしかった','うれしかった':'うれしかった','面白かった':'おもしろかった','悔しかった':'くやしかった','びっくりした':'びっくりした'};
function matchFeel(t){ let k=clean(t); for(const [a,b] of Object.entries(FEEL_KANJI)) k=k.split(a).join(b); k=k.replace(/[\s　]/g,''); return FEELINGS.find(f=>k.includes(f.w.replace(/\s/g,'')))||null }
function feelPolite(t){ t=clean(t); if(/(です|ました|でした)$/.test(t)) return t; if(/かった$/.test(t)) return t+'です'; if(/たい$/.test(t)) return t+'と おもいました'; if(/い$/.test(t)) return t.slice(0,-1)+'かったです'; if(/した$/.test(t)) return t.slice(0,-2)+'しました'; if(/[ただ]$/.test(t)) return t; return t+'でした' }
function whyText(t){ let x=clean(t).replace(/(なので|だから|ので|から)(です)?$/,''); if(x && !/[いたうくすつぬむるぐぶだ]$/.test(x)) x+='だ'; return x }
const NEXT_END=[['れんしゅうする','れんしゅうしたいです'],['する','したいです'],['やる','やりたいです'],['がんばる','がんばりたいです'],['とぶ','とびたいです'],['いく','いきたいです'],['よむ','よみたいです'],['かく','かきたいです'],['あそぶ','あそびたいです']];
function nextText(t){ const x=clean(t); if(/たいです$/.test(x)) return x; if(/たい$/.test(x)) return x+'です'; for(const [a,b] of NEXT_END) if(x.endsWith(a)) return x.slice(0,-a.length)+b; return x }

  show(`${topBar()}${stageHTML(P.code,q)}${teachBowl(T,st.k)}
    ${SR?`<div class="row mid"><button class="btn main mic" id="mic" type="button">🎤 ここを おして おしえる</button></div>
      <p class="heard" id="heard" aria-live="polite"></p>
      <div class="row mid" id="confirm" hidden><button class="btn main" id="yes" type="button">⭕ そう！</button><button class="btn" id="retry" type="button">🔁 もういちど</button></div>`
      :`<div id="typeArea">${typeBox}</div>`}
    <div class="row mid"><button class="btn" id="useCards" type="button">🃏 カードで おしえる</button>${SR?'<button class="btn" id="useType" type="button">⌨️ もじで</button>':''}</div>
    <div class="alt" id="alt"></div>`);
  bindTop(); bindSay(q); speak(q);
  let heard='';
  const done=(v,card)=>{ hush(); sfx('step'); st.set(T,v,card); if(i+1<TSTEPS.length) teachStep(i+1); else teachDone() };
  const bindType=()=>{ const tin=app.querySelector('#tin'); const go=()=>{ const v=tin.value.trim(); if(v) done(v,false) }; app.querySelector('#tok').addEventListener('click',go); tin.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing) go() }) };
  if(SR){
    const mic=app.querySelector('#mic'), h=app.querySelector('#heard'), cf=app.querySelector('#confirm'); let rec=null;
    const idle=()=>{ mic.classList.remove('on'); mic.textContent='🎤 ここを おして おしえる' };
    const start=()=>{ hush(); heard=''; cf.hidden=true; h.textContent='きいてるよ… はなしてね'; mic.classList.add('on'); mic.textContent='🎤 きいてるよ（おすと おわる）';
      rec=listen(t=>{ heard=t; h.textContent=`「${t}」` },(t,err)=>{ idle();
        if(t){ heard=t; h.textContent=`「${t}」`; cf.hidden=false; speak(`「${t}」だね？`) }
        else if(err==='not-allowed'||err==='service-not-allowed'||err==='unavailable'){ h.textContent='マイクが つかえないみたい。もじか カードで おしえてね'; app.querySelector('#alt').innerHTML=typeBox; bindType() }
        else h.textContent='きこえなかった… もういちど おしてね' }) };
    mic.addEventListener('click',()=>{ if(mic.classList.contains('on')){ try{ rec&&rec.stop() }catch(e){} return } sfx('tap'); start() });
    on('#yes',()=>done(heard,false));
    on('#retry',()=>{ sfx('tap'); start() });
    on('#useType',()=>{ sfx('tap'); app.querySelector('#alt').innerHTML=typeBox; bindType(); app.querySelector('#tin').focus() });
  } else bindType();
  on('#useCards',()=>{ sfx('tap'); const items=st.cards(T);
    app.querySelector('#alt').innerHTML=`<div class="grid">${items.map((v,j)=>`<button class="card small" type="button" data-j="${j}">${esc(v)}${st.k==='why'?'から':''}</button>`).join('')}</div>`;
    app.querySelectorAll('#alt .card').forEach(b=>b.addEventListener('click',()=>done(items[+b.dataset.j],true))) });
}
function teachDone(){
  const T=P.teach, L=teachLines(T), text=L.map(l=>l.t).join(''); P.feel=T.feelObj;
  const t=`${sensei()}、おしえてくれて ありがとう！ ノートに まとめたよ。こえに だして よんでみて`;
  show(`${topBar()}${stageHTML(P.code,t)}${bowlHTML(L)}
    <p class="hint">よめない かんじは、ひらがなで かいて いいよ</p>
    <div class="row mid"><button class="btn main" id="read" type="button">📣 よんだ！</button></div>
    <div class="row mid"><button class="link" id="model" type="button">🔊 さきに きいてみる</button> <button class="link" id="redo" type="button">✏️ はじめから おしえなおす</button></div>`);
  bindTop(); bindSay(t); speak(t);
  on('#model',()=>speak(text,false));
  on('#redo',()=>{ sfx('tap'); teachStart() });
  // うつす ぎょうの かずは、すすんだ ばしょに あわせて ふやす（もり1 → まち4）
  const k=Math.min(L.length, 1+Math.floor(P.ai/2));
  on('#read',()=>{ sfx('tap'); writeSeq(L.slice(0,k).map((l,j)=>({say:j?'つぎの ぎょうも うつしてね':'この ぶんを ノートに うつして くれる？', guide:l.t, r:l.r})), ()=>eat(L,'ごちそう',2)) });
}

/* ================= ずかん ================= */
function zukan(){
  show(`<div class="top"><button class="link" id="back" type="button">← もどる</button><span class="pill">📖 ${totalMet()}/${Object.keys(YOKAI).length}ひき</span></div>
    <p class="q">ようかいずかん</p>
    ${AREAS.map((a,i)=>`<p class="zukan-h">${a.icon} ${esc(a.name)}</p><div class="zukan">${a.yk.map(c=>met(c)
      ?`<button class="mon" type="button" data-c="${c}"><img src="./img/${c}.webp" alt=""><span class="name">${esc(YOKAI[c])}</span></button>`
      :`<div class="mon lock"><img class="shadow" src="./img/${c}.webp" alt=""><span class="name">？？？</span></div>`).join('')}</div>`).join('')}`);
  on('#back',()=>{ sfx('tap'); home() });
  on('.mon[data-c]',e=>{ const c=e.currentTarget.dataset.c; sfx('tap'); speak(YOKAI[c]) });
}

title();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script>
